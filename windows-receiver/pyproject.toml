[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mconn-receiver"
version = "0.1.0"
description = "MConn Windows receiver: authenticated, atomic file delivery from a paired phone."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "cryptography>=42",
  "segno>=1.6",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
mdns = ["zeroconf>=0.130"]

[project.scripts]
mconn-receiver = "mconn_receiver.main:main"

[tool.setuptools.packages.find]
include = ["mconn_receiver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B904"]
